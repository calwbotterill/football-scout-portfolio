<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }

      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 10px 0 20px;
      color: #475569;
      font-weight: 600;
      line-height: 1.5;
    }

    img {
      width: 100%;
      display: block;
      border: 1px solid #d5dfeb;
      border-radius: 14px;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.16);
    }

    .summary {
      margin-top: 20px;
      padding: 16px 18px;
      border: 1px solid #d5dfeb;
      border-radius: 14px;
      background: linear-gradient(145deg, #f8fbff, #f3f8fe);
      color: #1f2937;
      line-height: 1.65;

<body>
